name: Makefile CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Sync submodules
        run: git submodule sync --recursive

      - name: Fix apt mirrors
        run: |
          sudo sed -i 's|azure\.archive\.ubuntu\.com|archive.ubuntu.com|g' /etc/apt/apt-mirrors.txt 2>/dev/null || true
          sudo sed -i 's|azure\.archive\.ubuntu\.com|archive.ubuntu.com|g' /etc/apt/sources.list 2>/dev/null || true
          printf 'Acquire::Retries "0";\nAcquire::http::Timeout "10";\nAcquire::ftp::Timeout "10";\n' | sudo tee /etc/apt/apt.conf.d/99fastfail >/dev/null

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build build-essential libfreetype6-dev libx11-dev libxext-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev libxtst-dev libwayland-dev libegl-dev libgl1-mesa-dev curl unzip libxcb1-dev g++-15

      - name: Cache Lua/SoLoud downloads
        uses: actions/cache@v4
        with:
          path: |
            external/lua-5.4.8
            external/soloud20200207
          key: ${{ runner.os }}-downloads-${{ hashFiles('Makefile', '.github/workflows/makefile.yml') }}

      - name: Download Lua 5.4.8
        run: |
          if [ -d external/lua-5.4.8 ]; then echo "lua-5.4.8 already present (cache)"; else
            mkdir -p external
            curl -sL https://www.lua.org/ftp/lua-5.4.8.tar.gz | tar xz -C external
          fi

      - name: Download SoLoud 20200207
        run: |
          if [ -d external/soloud20200207 ]; then echo "soloud20200207 already present (cache)"; else
            mkdir -p external
            curl -sL https://solhsa.com/soloud/soloud_20200207_lite.zip -o /tmp/soloud.zip
            unzip -q -o /tmp/soloud.zip -d external
            rm -f /tmp/soloud.zip
          fi

      - name: Cache bgfx build
        uses: actions/cache@v4
        with:
          path: external/lib
          key: ${{ runner.os }}-bgfx-${{ hashFiles('external/bgfx/**', 'external/bx/**', 'external/bimg/**', 'Makefile') }}

      - name: Build bgfx/bimg/bx
        run: make bgfx

      - name: Cache SDL3 build
        uses: actions/cache@v4
        with:
          path: external/SDL/build
          key: ${{ runner.os }}-sdl3-${{ hashFiles('external/SDL/**', 'Makefile') }}

      - name: Build SDL3 from source
        run: |
          cmake -S external/SDL -B external/SDL/build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr/local
          cmake --build external/SDL/build -j2

      - name: Install SDL3
        run: |
          sudo cmake --install external/SDL/build
          sudo ldconfig

      - name: Cache CMake build
        uses: actions/cache@v4
        with:
          path: build
          key: ${{ runner.os }}-build-${{ hashFiles('CMakeLists.txt', 'src/**', 'tests(vibecoded)/cpp/**', 'Makefile') }}

      - name: Build project
        run: |
          export PKG_CONFIG_PATH=/usr/local/lib64/pkgconfig:$PKG_CONFIG_PATH
          cmake -B build -G Ninja \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=g++-15 \
            -DCMAKE_BUILD_TYPE=Release
          ninja -C build
          ln -sf build/compile_commands.json compile_commands.json 2>/dev/null || true

      - name: Run tests
        run: |
          ninja -C build insane_night_tests
          BUILD_DIR=build bash "tests(vibecoded)/run.sh"
