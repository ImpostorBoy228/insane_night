name: Makefile CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Sync submodules
        run: git submodule sync --recursive

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build build-essential libfreetype6-dev libx11-dev libxext-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev libxtst-dev libwayland-dev libegl-dev

      # ── Lua ───────────────────────────────────────────────────
      - name: Cache Lua 5.4.8
        id: cache-lua
        uses: actions/cache@v4
        with:
          path: external/lua-5.4.8
          key: lua-5.4.8-src

      - name: Download Lua 5.4.8
        if: steps.cache-lua.outputs.cache-hit != 'true'
        run: |
          mkdir -p external
          curl -sL https://www.lua.org/ftp/lua-5.4.8.tar.gz | tar xz -C external

      # ── SoLoud ────────────────────────────────────────────────
      - name: Cache SoLoud 20200207
        id: cache-soloud
        uses: actions/cache@v4
        with:
          path: external/soloud20200207
          key: soloud-20200207-src

      - name: Download SoLoud 20200207
        if: steps.cache-soloud.outputs.cache-hit != 'true'
        run: |
          curl -sL https://solhsa.com/soloud/soloud_20200207_lite.zip -o /tmp/soloud.zip
          unzip -q -o /tmp/soloud.zip -d external

      # ── SDL3 ──────────────────────────────────────────────────
      - name: Get SDL submodule commit
        id: sdl-commit
        run: echo "hash=$(git submodule status external/SDL | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Cache SDL3 build
        id: cache-sdl
        uses: actions/cache@v4
        with:
          path: external/SDL/build
          key: sdl3-build-${{ runner.os }}-${{ steps.sdl-commit.outputs.hash }}

      - name: Build SDL3 from source
        if: steps.cache-sdl.outputs.cache-hit != 'true'
        run: |
          cmake -S external/SDL -B external/SDL/build -DCMAKE_BUILD_TYPE=Release
          cmake --build external/SDL/build --config Release

      - name: Install SDL3
        run: sudo cmake --install external/SDL/build

      # ── Project build ─────────────────────────────────────────
      - name: Cache CMake build directory
        id: cache-build
        uses: actions/cache@v4
        with:
          path: build
          key: ninja-build-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'src/**', 'external/tsfont/**') }}

      - name: Build from source
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_BUILD_TYPE=Release
          ninja -C build
          ln -sf build/compile_commands.json compile_commands.json 2>/dev/null; true

      # ── Tests ────────────────────────────────────────────────
      - name: Install Lua 5.4
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4

      - name: Build and run tests
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
          ninja -C build insane_night_tests
          BUILD_DIR=build bash tests(vibecoded)/run.sh
